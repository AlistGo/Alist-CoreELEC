name: Sync AList release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "AList version/tag (empty means latest stable release)"
        required: false
        type: string
      force:
        description: "Rebuild and replace assets if this release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-alist-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: AlistGo/alist

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      is_latest: ${{ steps.detect.outputs.is_latest }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      version: ${{ steps.detect.outputs.version }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
    steps:
      - name: Resolve upstream release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
        shell: bash
        run: |
          set -Eeuo pipefail

          latest_tag="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"

          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            upstream_tag="$REQUESTED_VERSION"
            [[ "$upstream_tag" == v* ]] || upstream_tag="v${upstream_tag}"
            release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${upstream_tag}")"
          else
            upstream_tag="$latest_tag"
            release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${upstream_tag}")"
          fi

          if [[ "$(jq -r '.draft or .prerelease' <<<"$release_json")" == "true" ]]; then
            echo "Refusing to package a draft or prerelease: $upstream_tag" >&2
            exit 1
          fi

          version="${upstream_tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream version: $version" >&2
            exit 1
          fi

          release_tag="alist-${upstream_tag}"
          should_build=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE_BUILD:-false}" != "true" ]]; then
              should_build=false
            fi
          fi

          is_latest=false
          [[ "$upstream_tag" == "$latest_tag" ]] && is_latest=true

          {
            echo "upstream_tag=$upstream_tag"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "should_build=$should_build"
            echo "is_latest=$is_latest"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $upstream_tag (build: $should_build, latest: $is_latest)"

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm, aarch64, x86_64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext libxml2-utils

      - name: Validate project files
        run: ./scripts/check.sh

      - name: Read upstream asset digest
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$ARCH" in
            arm)     asset="alist-linux-musleabihf-armv7l.tar.gz" ;;
            aarch64) asset="alist-linux-musl-arm64.tar.gz" ;;
            x86_64)  asset="alist-linux-musl-amd64.tar.gz" ;;
          esac
          digest="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${UPSTREAM_TAG}" \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest // empty")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Missing or invalid SHA-256 digest for upstream asset: $asset" >&2
            exit 1
          fi
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"

      - name: Build add-on
        env:
          ALIST_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          ./scripts/build-addon.sh \
            "${{ needs.detect.outputs.upstream_tag }}" \
            "${{ matrix.arch }}" \
            dist

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: service.alist-${{ needs.detect.outputs.version }}-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download add-on artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Assemble dist/
        shell: bash
        run: |
          set -Eeuo pipefail
          for arch in arm aarch64 x86_64; do
            mkdir -p "dist/${arch}"
            cp -R "dist-artifacts/service.alist-${{ needs.detect.outputs.version }}-${arch}/." "dist/${arch}/"
          done

      - name: Resolve GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Kodi repository site
        run: |
          ./scripts/build-repository.sh dist site "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Collect release assets
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p release
          for arch in arm aarch64 x86_64; do
            cp "dist/${arch}/service.alist-${VERSION}.zip" "release/service.alist-${VERSION}-${arch}.zip"
            for repo_zip in dist/${arch}/repository.alist.${arch}-*.zip; do
              cp "$repo_zip" "release/$(basename "$repo_zip")"
            done
          done
          (cd release && sha256sum *.zip > SHA256SUMS)
          ls -l release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        shell: bash
        run: |
          set -Eeuo pipefail

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}/releases/tag/${UPSTREAM_TAG}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "CoreELEC / LibreELEC add-on build of AList ${VERSION}."
            echo
            echo "| Architecture | CoreELEC build | Service add-on |"
            echo "|---|---|---|"
            echo "| \`arm\` | Amlogic-ng (32-bit userspace) | \`service.alist-${VERSION}-arm.zip\` |"
            echo "| \`aarch64\` | Amlogic-ne (64-bit userspace) | \`service.alist-${VERSION}-aarch64.zip\` |"
            echo "| \`x86_64\` | LibreELEC Generic | \`service.alist-${VERSION}-x86_64.zip\` |"
            echo
            echo "Install the matching \`repository.alist.<arch>-*.zip\` once to receive future updates from Kodi. Repository index: ${BASE_URL}"
            echo
            echo "- Upstream release: ${upstream_url}"
            echo "- The AList binary is the unmodified official musl static build"
            echo
            echo "## Upstream release notes"
            echo
            gh api "repos/${UPSTREAM_REPOSITORY}/releases/tags/${UPSTREAM_TAG}" --jq '.body // ""'
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "AList ${VERSION} for CoreELEC" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "AList ${VERSION} for CoreELEC" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

  deploy-pages:
    # Only the newest upstream release may replace the repository index,
    # otherwise a forced rebuild of an older version would downgrade users.
    needs: [detect, release]
    if: needs.detect.outputs.should_build == 'true' && needs.detect.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Kodi repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
