name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext (msgfmt)
        run: sudo apt-get update -q && sudo apt-get install -y -q gettext libxml2-utils
      - name: Static checks and packaging test
        run: ./scripts/check.sh
